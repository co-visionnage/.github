---
version: 2
updates:
  # Общие workflow лежат здесь, и версии их действий обновляются в одном месте
  # для всех Go-сервисов.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
