---
# Общая сборка образа сервиса и публикация в GHCR, затем сканирование образа.
# Вызывается из ci.yml репозитория после успешных проверок, только на main:
#
#   publish:
#     if: github.ref == 'refs/heads/main' && github.event_name == 'push'
#     needs: ci
#     permissions:
#       contents: read
#       packages: write
#     uses: co-visionnage/.github/.github/workflows/docker-publish.yml@main
#
# Образ получает теги <короткий хеш коммита> и latest; хеш же передаётся в
# Dockerfile как ARG VERSION (попадает в метрику build_info).
name: Docker publish

on:
  workflow_call:
    inputs:
      context:
        description: Каталог сборки
        type: string
        default: .
    outputs:
      image-tag:
        description: Короткий хеш коммита, которым помечен образ
        value: ${{ jobs.build.outputs.image-tag }}
      image:
        description: Имя образа без тега
        value: ${{ jobs.build.outputs.image }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trivy image scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.image-tag }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.58.0 \
            image --severity HIGH,CRITICAL --exit-code 0 --format table "$IMAGE_REF"
