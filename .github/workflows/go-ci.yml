---
# Общая проверка Go-сервисов (notrecinema-api, notrecinema-worker): vet, lint,
# юнит- и интеграционные тесты, сканеры. Вызывается из ci.yml репозитория:
#
#   jobs:
#     ci:
#       uses: co-visionnage/.github/.github/workflows/go-ci.yml@main
#       secrets: inherit
#
# Версия Go берётся из go.mod, так что обновлять её здесь не нужно.
name: Go CI

on:
  workflow_call:
    inputs:
      golangci-lint-version:
        description: Версия golangci-lint
        type: string
        default: v2.11
      integration:
        description: Запускать интеграционные тесты (нужны Postgres, NATS и схема БД)
        type: boolean
        default: true
      schema-repository:
        description: Репозиторий со схемой БД
        type: string
        default: co-visionnage/database
      secret-scan:
        description: Искать секреты в истории (gitleaks, нужна лицензия GITLEAKS_LICENSE)
        type: boolean
        default: false
      block-on-vulnerabilities:
        description: Падать, если govulncheck нашёл уязвимость (по умолчанию только отчёт)
        type: boolean
        default: false
    secrets:
      CHECKOUT_TOKEN:
        description: Токен с чтением схемы БД, если репозиторий приватный (иначе берётся токен запуска)
        required: false
      GITLEAKS_LICENSE:
        required: false

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          args: --timeout 5m ./...

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: |
          go test ./... -v > unit-test-output.log 2>&1 || TEST_EXIT=$?
          cat unit-test-output.log
          go run github.com/jstemmer/go-junit-report/v2@latest -in unit-test-output.log -out junit-unit.xml
          exit ${TEST_EXIT:-0}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml
          retention-days: 7

  integration-tests:
    if: inputs.integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notrecinema_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: notrecinema_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
      APP_DB_PASSWORD: ci-app-password
      MIGRATE_DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/notrecinema_ci
      DATABASE_URL: postgresql://app_user:ci-app-password@localhost:5432/notrecinema_ci
      NATS_URL: nats://localhost:4222
      PGHOST: localhost
      PGPASSWORD: ci-postgres-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Схема меняется вместе с кодом: если в репозитории схемы есть ветка с тем
      # же именем, что у этой (feat/account-security в обоих), тесты идут против
      # неё, иначе против ветки по умолчанию. Так pull request с новым кодом не
      # ждёт слияния миграций, чтобы позеленеть.
      - name: Pick the schema branch
        id: schema
        env:
          TOKEN: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          REPOSITORY: ${{ inputs.schema-repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Схема: ветка $BRANCH"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "Схема: ветка по умолчанию"
          fi
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.schema-repository }}
          ref: ${{ steps.schema.outputs.ref }}
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          path: schema-ci
      - name: Apply the schema
        working-directory: schema-ci
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          sh init.sh
          npm install
          npm run migrate

      # Сервисы читают из JetStream, поэтому NATS запускается с -js; контейнеру
      # сервиса Actions нельзя передать аргументы сервера, отсюда docker run.
      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js

      - run: go test -tags integration ./... -v

  trivy-filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.58.0 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format table .

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: ${{ !inputs.block-on-vulnerabilities }}

  secret-detection:
    if: inputs.secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
